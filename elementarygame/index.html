<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>生活偵探</title>
  <link rel="stylesheet" href="css/game.css">
</head>
<body>
  <main class="app">
    <div class="topbar">
      <div class="brand">生活偵探 · 5–7 歲</div>
    </div>
    <header class="home-hero">
      <h1>家裡發生什麼事？</h1>
      <p class="say">不是做家事遊戲。是當小偵探，把真的事情看清楚。</p>
    </header>

    <a class="case-link" href="cases/pink-laundry/index.html">
      <img src="art/scene-story.jpg" alt="粉紅衣服案件圖畫">
      <div class="case-body">
        <span class="pill">可以玩</span>
        <h2>白衣服洗完為什麼變粉紅？</h2>
        <p class="soft">一件真的洗衣意外。看圖畫，也看真的照片。</p>
      </div>
    </a>

    <a class="case-link" href="cases/droop-leaf/index.html">
      <img src="art/wilt-scene.png" alt="葉子軟掉案件圖畫">
      <div class="case-body">
        <span class="pill">可以玩</span>
        <h2>葉子為什麼軟掉了？</h2>
        <p class="soft">一盆真的植物。摸土、看盆底、看它站哪。</p>
      </div>
    </a>

    <p class="note">圖畫是畫的。旁邊寫「真的」的，才是網路上找來的真實照片。</p>
  </main>
</body>
</html>
